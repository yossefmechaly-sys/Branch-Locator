name: CI

# Vérifications sur des bases PostgreSQL isolées, sans accès au VPS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------
  # Le build consulte PostgreSQL pour les paramètres des pages magasin.
  # ---------------------------------------------------------------------
  build-and-test:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: branch_locator_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d branch_locator_build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/branch_locator_build"
      NEXT_PUBLIC_SITE_URL: "https://ci-build.example.invalid"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret-not-for-production-use-only"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations (isolated CI database)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        # LayoutProps et les types de routes sont générés par Next.js.
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------
  # Parcours Playwright contre une base de démonstration isolée.
  # ---------------------------------------------------------------------
  e2e:
    name: Playwright E2E (base PostgreSQL réelle)
    runs-on: ubuntu-24.04
    needs: build-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maayan2000
          POSTGRES_PASSWORD: maayan2000
          POSTGRES_DB: maayan2000_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maayan2000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://maayan2000:maayan2000@localhost:5432/maayan2000_e2e?schema=public"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret-not-for-production-use-only"
      NEXTAUTH_URL: "http://localhost:3000"
      E2E_START_SERVER: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Base VIDE de service CI, jamais une base partagée/de production —
      # cohérent avec l'interdiction explicite de tester un rollback
      # destructif sur des données partagées (voir docs/production-deployment.md §6.2).
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npx prisma db seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (production mode, requis par playwright.config.ts webServer)
        run: npm run build

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
